<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1b1838" />
    <title>Cat Hunter - Mishmish's Adventure</title>
    <meta
      name="description"
      content="Catch the cheese, dodge the bombs, and join Mishmish across five worlds."
    />
    <meta property="og:title" content="Cat Hunter - Mishmish's Adventure" />
    <meta
      property="og:description"
      content="Catch the cheese, dodge the bombs, and join Mishmish across five worlds."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: radial-gradient(circle at center, #251f4d 0%, #0f0d22 72%, #080614 100%);
        overflow: hidden;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      #game canvas {
        display: block;
        box-shadow: 0 0 48px rgba(0, 0, 0, 0.65);
        border-radius: 6px;
      }
      #splash-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        background: #1b1838 url('assets/splash_loading.jpg') center center / cover no-repeat;
        padding-bottom: max(12vh, 72px);
        pointer-events: none;
        transition: opacity 0.35s ease;
      }
      #splash-loader .bar-wrap {
        width: min(68vw, 320px);
        height: 14px;
        border-radius: 999px;
        background: rgba(15, 11, 36, 0.78);
        border: 2px solid #ffd629;
        overflow: hidden;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
      }
      #splash-loader .bar-fill {
        width: 45%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #ffb703, #ffe566, #ffb703);
        animation: splashPulse 1.1s ease-in-out infinite alternate;
      }
      @keyframes splashPulse {
        from { transform: translateX(-15%); width: 35%; }
        to { transform: translateX(65%); width: 60%; }
      }
    </style>
  </head>
  <body oncontextmenu="return false;">
    <div id="splash-loader" aria-hidden="true"><div class="bar-wrap"><div class="bar-fill"></div></div></div>
    <div id="game"></div>
    <script src="lib/phaser.min.js"></script>
    <script src="game.bundle.js"></script>
  </body>
</html>
